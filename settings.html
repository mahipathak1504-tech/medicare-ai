<!-- Main -->

<div class="main">

<h1>⚙️ Settings</h1>

<p>Customize your MediCare AI experience.</p>

<div class="settings-container">

<div class="setting-card">

<h3><i class="fa-solid fa-bell"></i> Notifications</h3>

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>

</div>

<div class="setting-card">

<h3><i class="fa-solid fa-moon"></i> Dark Mode</h3>

<label class="switch">
<input type="checkbox" id="darkModeToggle">
<span class="slider"></span>
</label>

</div>

<div class="setting-card">

<h3><i class="fa-solid fa-language"></i> Language</h3>

<select>

<option>English</option>

<option>Hindi</option>

<option>Gujarati</option>

</select>

</div>

<div class="setting-card">

<h3><i class="fa-solid fa-lock"></i> Change Password</h3>

<button class="btn">Change Password</button>

</div>

<div class="setting-card">

<h3><i class="fa-solid fa-right-from-bracket"></i> Logout</h3>

<button class="logout-btn">Logout</button>

</div>

</div>

</div>

<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
